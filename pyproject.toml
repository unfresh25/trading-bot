[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hybrid-trader"
version = "0.1.0"
description = "Auditable, leakage-resistant quantitative trading research baseline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1,<2",
  "exchange-calendars>=4.11,<5",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<21",
  "pydantic>=2.8,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.1,<4"]
dev = ["pytest>=8.3,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1"]
server = ["uvicorn>=0.35,<1"]

[project.scripts]
hybrid-trader = "hybrid_trader.cli:main"
hybrid-data = "hybrid_trader.data_cli:main"
hybrid-report = "hybrid_trader.report_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
